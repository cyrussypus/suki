[workspace]
members = ["crates/suki-backend", "crates/suki-mobile", "crates/suki-shared"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
suki-shared = { path = "crates/suki-shared" }
