name: Rust workspace

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: runner-root
          MARIADB_DATABASE: suki_test
          MARIADB_USER: suki
          MARIADB_PASSWORD: runner-test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      TEST_DATABASE_URL: mysql://suki:runner-test@127.0.0.1:3306/suki_test
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo check --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --locked -- --include-ignored

  native:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: android
            target: aarch64-linux-android
          - runner: macos-latest
            platform: ios
            target: aarch64-apple-ios-sim
    runs-on: ${{ matrix.runner }}
    env:
      SUKI_API_URL: https://suki.example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        if: matrix.platform == 'android'
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - run: rustup target add ${{ matrix.target }}
      - run: cargo install dioxus-cli --version 0.7.10 --locked
      - run: dx build --platform ${{ matrix.platform }} --target ${{ matrix.target }} --features mobile --locked
        working-directory: crates/suki-mobile
