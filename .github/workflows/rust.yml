name: Rust workspace

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: runner-root
          MARIADB_DATABASE: suki_test
          MARIADB_USER: suki
          MARIADB_PASSWORD: runner-test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      TEST_DATABASE_URL: mysql://suki:runner-test@127.0.0.1:3306/suki_test
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo check --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --locked -- --include-ignored

  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: android
            target: aarch64-linux-android
          - runner: macos-latest
            platform: ios
            target: aarch64-apple-ios-sim
    runs-on: ${{ matrix.runner }}
    env:
      SUKI_API_URL: https://suki.example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Rust toolchain
        run: rustup toolchain install --no-self-update
      - run: rustup target add ${{ matrix.target }}
      - name: Install Android command-line tools
        if: matrix.platform == 'android'
        run: |
          sdk_root="$RUNNER_TEMP/suki-android-sdk"
          archive="$RUNNER_TEMP/android-command-line-tools.zip"
          curl --fail --location --retry 3 \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip \
            --output "$archive"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $archive" | sha256sum --check
          mkdir -p "$sdk_root/cmdline-tools"
          unzip -q "$archive" -d "$sdk_root/cmdline-tools"
          mv "$sdk_root/cmdline-tools/cmdline-tools" "$sdk_root/cmdline-tools/latest"
          {
            echo "ANDROID_HOME=$sdk_root"
            echo "ANDROID_SDK_ROOT=$sdk_root"
            echo "NDK_HOME=$sdk_root/ndk/27.2.12479018"
          } >> "$GITHUB_ENV"
      - name: Install Android SDK packages
        if: matrix.platform == 'android'
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (set +o pipefail; yes | "$sdkmanager" --sdk_root="$ANDROID_HOME" --licenses > "$RUNNER_TEMP/android-licenses.log")
          "$sdkmanager" --sdk_root="$ANDROID_HOME" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - run: cargo install dioxus-cli --version 0.7.10 --locked
      - run: dx build --platform ${{ matrix.platform }} --target ${{ matrix.target }} --features mobile --locked
        working-directory: crates/suki-mobile
