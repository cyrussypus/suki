[package]
name = "suki-mobile"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
dioxus = { version = "=0.7.10", default-features = false, features = ["minimal", "document"] }
futures-util = { version = "0.3", features = ["sink"] }
serde.workspace = true
serde_json.workspace = true
suki-shared.workspace = true
uuid = { version = "1", features = ["v4", "js"] }
time = { version = "0.3", features = ["formatting", "macros"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "cookies", "multipart"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
webpki-roots = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "net"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-net = { version = "0.7", features = ["websocket"] }
gloo-timers = { version = "0.3", features = ["futures"] }
futures-channel = "0.3"
wasm-bindgen = "0.2"
js-sys = "0.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart"] }
web-sys = { version = "0.3", features = ["Window", "Location", "Navigator", "Geolocation", "Position", "Coordinates", "PositionError", "PositionOptions"] }

[features]
default = []
mobile = ["dioxus/mobile"]
web = ["dioxus/web"]

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["NSDate"] }
objc2-ui-kit = { version = "0.3", default-features = false, features = ["UIApplication", "UIResponder"] }
objc2-core-location = { version = "0.3", default-features = false, features = ["std", "CLLocation", "CLLocationManager", "CLLocationManagerDelegate"] }
