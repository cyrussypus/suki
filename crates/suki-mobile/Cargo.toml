[package]
name = "suki-mobile"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
dioxus = { version = "=0.7.10", default-features = false, features = ["minimal", "document"] }
futures-util = { version = "0.3", features = ["sink"] }
serde.workspace = true
serde_json.workspace = true
suki-shared.workspace = true
uuid = { version = "1", features = ["v4", "js"] }
time = { version = "0.3", features = ["formatting", "macros"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "cookies"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
webpki-roots = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "net"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-net = { version = "0.7", features = ["websocket"] }
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
web-sys = { version = "0.3", features = ["Window", "Location"] }

[features]
default = []
mobile = ["dioxus/mobile"]
web = ["dioxus/web"]
