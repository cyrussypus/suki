[package]
name = "suki-backend"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "suki_api"

[[bin]]
name = "suki-api"
path = "src/main.rs"

[dependencies]
suki-shared = { workspace = true, features = ["sqlx"] }
axum = { version = "0.8.9", features = ["ws", "multipart"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9.0", default-features = false, features = ["mysql", "runtime-tokio", "tls-rustls", "derive", "migrate", "macros"] }
serde.workspace = true
serde_json.workspace = true
argon2 = "0.6.0"
sha2 = "0.11.1"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
tower-http = { version = "0.7.1", features = ["trace", "limit", "set-header", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
futures-util = "0.3"
ring = "=0.17.14"
aws-sdk-s3 = { version = "1.161.0", default-features = false, features = ["http-1x", "rustls", "default-https-client", "rt-tokio"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio-tungstenite = "0.29"
